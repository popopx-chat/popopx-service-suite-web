# POPOPX Service Suite portal — container Nginx config.
#
# This is the *container* variant of the production setup: it serves the Next.js
# static export on port 80 with no TLS termination, because a container
# deployment normally puts a load balancer or a reverse-terminating edge in
# front. For a bare-metal CentOS host, use `deploy/centos/nginx-popopx-service.conf`
# instead — that file carries the certificate paths, the HTTP→HTTPS redirect and
# the full header set.
#
# Copyright (c) 2026 POPOPX (popopx.chat)
# SPDX-License-Identifier: AGPL-3.0-only

user  nginx;
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    # `$http_referer` is logged by format, but the site sends no referrer and
    # accepts none, so this column is always empty in practice.
    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;
    keepalive_timeout  65;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/html
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    server {
        listen       80;
        listen  [::]:80;
        server_name  mp.popopx.chat _;

        root  /usr/share/nginx/html;
        index index.html;

        # Same-origin only. `style-src 'unsafe-inline'` is required because
        # React emits inline style attributes; there is no third-party entry
        # because the export ships no remote asset.
        add_header X-Frame-Options                "DENY"        always;
        add_header X-Content-Type-Options         "nosniff"     always;
        add_header Referrer-Policy                "no-referrer" always;
        add_header X-DNS-Prefetch-Control         "off"         always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'none'" always;

        location ^~ /_next/static/ {
            expires    1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files  $uri =404;
        }

        location = /_next/image {
            return 404;
        }

        location = /site.webmanifest {
            default_type application/manifest+json;
            expires      7d;
        }

        location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico)$ {
            expires    30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
            try_files  $uri =404;
        }

        # trailingSlash: true -> every route is a directory with an index.html.
        location / {
            try_files $uri $uri/index.html $uri.html =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        location ~* \.(?:php|pl|py|cgi|sh|env|ini|lock|bak|old)$ {
            deny all;
            return 404;
        }

        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }
    }
}
