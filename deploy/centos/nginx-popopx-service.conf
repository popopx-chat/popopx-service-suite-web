# POPOPX Service Suite portal — production Nginx vhost for CentOS / RHEL / Rocky / Alma.
#
# This portal is a Next.js *static export*: `npm run build` writes `out/`, which is
# plain HTML/CSS/JS/SVG with no server-side runtime. So this vhost only has to
# (1) serve those files, (2) resolve the trailing-slash directory index files the
# export produces, (3) send strict security headers, and (4) leak nothing to third
# parties.
#
# Install order matters and `deploy/centos/deploy_centos.sh` does it for you:
#   1. put the built `out/` into $WEB_ROOT (default /var/www/mp.popopx.chat)
#   2. get the certificate first (`certbot certonly --webroot ...`), because this
#      file references /etc/letsencrypt/live/mp.popopx.chat/*.pem — `nginx -t`
#      would fail on a missing key
#   3. cp this file to /etc/nginx/conf.d/ ; nginx -t ; systemctl reload nginx
#
# Requirements: nginx >= 1.25.1 for the `http2 on;` directive below. On an older
# build (EPEL on CentOS 7/8 ships 1.20/1.24) change it to `listen 443 ssl http2;`
# — deploy_centos.sh checks the version and tells you which.

# ---------------------------------------------------------------------------
# HTTP: ACME challenge only, everything else moves to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen       80;
    listen       [::]:80;
    server_name  mp.popopx.chat;

    root /var/www/mp.popopx.chat;

    # `certbot certonly --webroot -w /var/www/mp.popopx.chat` writes here.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /.well-known/acme-challenge/ {
        return 404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/mp.popopx.chat.http.access.log combined;
    error_log  /var/log/nginx/mp.popopx.chat.error.log warn;
}

# ---------------------------------------------------------------------------
# HTTPS: the static portal.
# ---------------------------------------------------------------------------
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  mp.popopx.chat;

    root  /var/www/mp.popopx.chat;
    index index.html;

    server_tokens off;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/mp.popopx.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mp.popopx.chat/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:POPOPX:10m;
    ssl_session_timeout       1d;

    # OCSP stapling needs a resolver; adjust for your network if these fail.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # If you run `certbot --nginx -d mp.popopx.chat` instead of the `certonly`
    # path above, Certbot rewrites this server block and adds these two lines
    # itself. They are left commented so `nginx -t` does not fail on a file that
    # only exists after Certbot has run.
    # include     /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ----------------------------------------------------
    # The CSP is same-origin only, and that is genuinely achievable here: the
    # static export bundles every script into /_next/static and inlines no 3P
    # code. `style-src 'unsafe-inline'` is required because React emits inline
    # style attributes; there is no `connect-src` wildcard because the page
    # talks to nobody but this origin.
    add_header X-Frame-Options                        "DENY"            always;
    add_header X-Content-Type-Options                 "nosniff"         always;
    add_header Referrer-Policy                        "no-referrer"     always;
    add_header X-DNS-Prefetch-Control                 "off"             always;
    add_header X-Permitted-Cross-Domain-Policies      "none"            always;
    add_header Cross-Origin-Opener-Policy             "same-origin"     always;
    add_header Cross-Origin-Resource-Policy           "same-origin"     always;
    add_header Strict-Transport-Security              "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), web-share=(), xr-spatial-tracking=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests" always;

    # COEP is left off deliberately: `require-corp` plus CORP same-origin is
    # enough for a single-origin page, and turning it on is the classic way to
    # break your own assets on a mis-configured host.
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # --- Static assets -------------------------------------------------------
    # Next.js fingerprints everything under /_next/static, so it is immutable.
    # HTML must never be cached, or a visitor keeps an outdated portal.
    location ^~ /_next/static/ {
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # images.unoptimized is set for the export, so the loader route must exist.
    location = /_next/image {
        return 404;
    }

    location = /logo-popopx.png {
        expires    30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /favicon.png {
        expires    30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /apple-touch-icon.png {
        expires    30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires      7d;
        add_header   Cache-Control "public, max-age=604800";
    }

    location = /robots.txt {
        expires    1d;
        access_log off;
    }

    # --- Compression ---------------------------------------------------------
    # gzip is built into nginx; brotli needs the third-party ngx_brotli module,
    # so those directives are documented rather than claimed as active.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/html
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # ngx_brotli (dnf install nginx-mod-brotli on some distros, or build it):
    #   load_module modules/ngx_http_brotli_filter_module.so;
    #   load_module modules/ngx_http_brotli_static_module.so;
    #   brotli on;
    #   brotli_comp_level 6;
    #   brotli_types text/css text/html application/javascript application/json image/svg+xml;

    # --- Routing -------------------------------------------------------------
    # `trailingSlash: true` makes every route a directory with an index.html, so
    # a plain try_files chain is enough. There is no SPA rewrite and no backend
    # to proxy: this portal never calls an API.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Nothing in this build is executable: no PHP, no Node server, no proxy.
    location ~* \.(?:php|pl|py|cgi|sh|env|ini|lock|bak|old)$ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/mp.popopx.chat.access.log combined;
    error_log  /var/log/nginx/mp.popopx.chat.error.log warn;
}
